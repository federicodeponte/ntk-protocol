<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>NTK logo</title>
<!-- Source for assets/logo.png and assets/logo-dark.png (README header) and the mark PNGs.
     ?mode=light|dark  ?kind=lockup|mark  Render: python3 assets/src/render.py -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
*{margin:0;box-sizing:border-box}
html,body{background:transparent}
.lockup{display:inline-flex;align-items:center;gap:36px;padding:20px 24px}
.lockup svg{width:168px;height:168px;flex:none}
.words{display:flex;flex-direction:column;gap:6px}
.name{font-family:"Instrument Serif",Georgia,serif;font-size:132px;line-height:.95;letter-spacing:-.01em}
.tag{font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:500;font-size:26px;letter-spacing:.16em;text-transform:uppercase;opacity:.7}
.mark{display:block}
</style></head>
<body>
<div id="root"></div>
<script>
const q=new URLSearchParams(location.search),mode=q.get('mode')||'light',kind=q.get('kind')||'lockup',size=+(q.get('size')||512);
const ink=mode==='dark'?'#FFFFFF':'#14161B';
const mark=(s)=>`<svg viewBox="0 0 64 64" width="${s}" height="${s}"><path d="M14 8h36a8 8 0 0 1 8 8v24a8 8 0 0 1-8 8H30l-12 10v-10h-4a8 8 0 0 1-8-8V16a8 8 0 0 1 8-8z" fill="none" stroke="${ink}" stroke-width="5" stroke-linejoin="round"/><rect x="23" y="19" width="18" height="18" rx="1.5" fill="#FF4B33"/></svg>`;
const root=document.getElementById('root');
root.innerHTML=kind==='mark'?`<div class="mark">${mark(size)}</div>`
  :`<div class="lockup" style="color:${ink}">${mark(168)}<div class="words"><span class="name">Need-to-Know</span><span class="tag">NTK protocol</span></div></div>`;
document.fonts.ready.then(()=>document.body.dataset.ready='1');
</script>
</body></html>
